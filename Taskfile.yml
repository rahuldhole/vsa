version: '3'

tasks:
  default:
    desc: "Welcome! Run 'task --list' to see all available tasks."
    cmds:
      - task --list

  install:
    desc: "Step 1: Install all required dependencies across the workspace."
    cmds:
      - pnpm install

  build:
    desc: "Step 2: Build the core @rahuldhole/vsa package and vhp CLI."
    cmds:
      - pnpm --filter @rahuldhole/vsa --filter vhp run build

  dev:todo-vhp:
    desc: "Step 3: Start the single-file todo-vhp example using the vhp CLI."
    cmds:
      - cd examples/todo-vhp && node ../../packages/vhp/dist/cli.mjs dev

  dev:todo-nuxt:
    desc: "Step 4: Start the Nuxt todo list example."
    cmds:
      - cd examples/todo-list-nuxt && pnpm run dev

  dev:todo-vue:
    desc: "Step 5: Start the Vite todo list example."
    cmds:
      - cd examples/todo-list-vue && pnpm run dev

